server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: split-excel-backend
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 250MB
      enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    com.excelexpert.splitexcel: DEBUG
    org.apache.poi: WARN

